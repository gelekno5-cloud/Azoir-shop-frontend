# Automatic journal posts: the weekly cloud routine pushes a claude/journal-* branch.
# This checks it with scripts/check-journal-post.py and, if it passes, merges it into
# main. Railway deploys main. A failed check leaves the branch unmerged.
name: Journal publish

on:
  push:
    branches: ["claude/journal-**"]

permissions:
  contents: write

concurrency:
  group: journal-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the post
        run: python3 scripts/check-journal-post.py origin/main

      - name: Merge into main
        run: |
          git config user.name "azoir-journal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-ff "origin/${GITHUB_REF_NAME}" -m "Journal: merge ${GITHUB_REF_NAME} (automatic weekly post)"
          git push origin main
